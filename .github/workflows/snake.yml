name: cobrinha dos commits

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: gerar svg da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: micsxnn
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#000000&color_dots=#e5e5e5,#9e9e9e,#6b6b6b,#3a3a3a,#000000
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ffffff&color_dots=#1f1f1f,#3f3f3f,#6f6f6f,#b0b0b0,#ffffff

      - name: publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
